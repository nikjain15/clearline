<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clearline: agentic fund operations for private markets. Agents propose, people release. A product demo on synthetic data.">
<title>Clearline Fund Ops</title>
</head>
<body>
<style>
/* Clearline, material-first. Relay tokens verbatim. One screen per case: what came in | what Clearline did | what you decide. */
:root{--ink:#1a1a1a;--ink-2:#5c5c5c;--ink-3:#686868;--line:#e4e2dd;--line-strong:#bcb9b2;--surface:#ffffff;--subtle:#f6f5f2;--selected:#ecebe6;--critical:#b3121f;--critical-soft:#fbecec;--positive:#2d6a4f;--positive-soft:#e9f2ed;--caution:#7a5200;--caution-soft:#faf3e1;--agent:#4a3f9a;--agent-soft:#edeaf7;--advisor:#0f5a8a;--advisor-soft:#e6f0f7;--client:#0e6b5e;--client-soft:#e4f1ee;--font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;--radius:2px;--radius-lg:8px;--text-caption:11px;--text-meta:12px;--text-body:13px;--text-lead:14px;--text-brief:15px;--text-heading:16px;--text-brand:17px;--text-stat:20px;--text-stat-lg:24px;--text-title:28px;--text-display:30px;color-scheme:light}
*{box-sizing:border-box}
html{font-family:var(--font)}
body{margin:0;background:var(--surface);color:var(--ink);font-size:var(--text-lead);line-height:1.5;padding-block:0;padding-inline:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit}
h1,h2,h3,p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);color:var(--ink-3)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;height:56px;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:var(--surface);padding:0 24px}
.brand{font-size:var(--text-brand);font-weight:600;letter-spacing:-.01em}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:var(--text-meta);color:var(--ink-3)}
.prog i{display:inline-block;width:22px;height:2px;background:var(--line-strong)}.prog i.on{background:var(--ink)}
.back{font-size:var(--text-meta);color:var(--ink-3);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line-strong)}
main{padding:32px 24px 72px}
.wrap{max-width:1240px;margin:0 auto}
h1.t{font-size:var(--text-title);font-weight:300;line-height:1.15;letter-spacing:-.01em}
.sub{margin-top:6px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:1.25fr 1fr .75fr;gap:20px;margin-top:24px;align-items:start}
.col{min-width:0}
.col>h2{font-size:var(--text-caption);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.who{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius);padding:0 6px;font-size:var(--text-caption);font-weight:500;text-transform:none;letter-spacing:0}
.who i{display:inline-block;width:6px;height:6px;border-radius:50%}
.who.agent{background:var(--agent-soft);color:var(--agent)}.who.agent i{background:var(--agent)}
.who.you{background:var(--advisor-soft);color:var(--advisor)}.who.you i{background:var(--advisor)}
.who.client{background:var(--client-soft);color:var(--client)}.who.client i{background:var(--client)}
/* documents */
.doc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.doc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--line-strong);font-size:var(--text-meta);color:var(--ink-2)}
.doc .hd b{color:var(--ink);font-weight:600;font-size:var(--text-body)}
table{width:100%;border-collapse:collapse;font-size:var(--text-body)}
th{padding:6px 12px;text-align:left;font-size:var(--text-caption);font-weight:400;color:var(--ink-3);border-bottom:1px solid var(--line)}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.desc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--text-meta);letter-spacing:-.01em;color:var(--ink-2)}
tr.hl td{background:var(--caution-soft)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--caution)}
tr.ok td{background:var(--positive-soft)}
.tscroll{overflow-x:auto}
.rec{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-top:10px;font-size:var(--text-body)}
.rec .nm{font-weight:600;font-size:var(--text-lead)}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:var(--text-meta)}
.rec dt{color:var(--ink-3)}.rec dd{margin:0;color:var(--ink-2)}
.rec.pick{box-shadow:inset 0 0 0 2px var(--ink)}
.rec .tag{float:right;font-size:var(--text-caption);font-weight:500;padding:0 6px;border-radius:var(--radius)}
.tag.p{background:var(--positive-soft);color:var(--positive)}.tag.c{background:var(--caution-soft);color:var(--caution)}.tag.n{background:var(--subtle);color:var(--ink-2)}
.say{margin-top:12px;font-size:var(--text-lead);line-height:1.55}
.say b{font-weight:600}
.entry{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--subtle);font-size:var(--text-body)}
.entry .hd{padding:6px 12px;border-bottom:1px solid var(--line);font-size:var(--text-caption);color:var(--ink-3)}
.entry .ln{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 12px}
.entry .ln+.ln{border-top:1px solid var(--line)}
.entry.pending{opacity:.55}
.entry.posted{background:var(--positive-soft);border-color:color-mix(in srgb,var(--positive) 40%,transparent)}
.b{display:inline-flex;min-height:40px;align-items:center;justify-content:center;border-radius:var(--radius);padding:8px 14px;line-height:1.3;font-size:var(--text-lead);border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;width:100%;text-align:center}
.b:hover{background:var(--subtle)}
.b.pri{background:var(--ink);color:var(--surface)}.b.pri:hover{opacity:.85;background:var(--ink)}
.b+.b{margin-top:8px}
.b[disabled]{opacity:.4;cursor:not-allowed}
.hint{margin-top:10px;font-size:var(--text-meta);color:var(--ink-3)}
.done{border:1px solid color-mix(in srgb,var(--positive) 40%,transparent);background:var(--positive-soft);border-radius:var(--radius);padding:10px 12px;font-size:var(--text-body)}
.done b{display:block;font-weight:600;margin-bottom:2px}
.next{margin-top:12px}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px}
.stat div{min-width:0}
.stat .v{font-size:var(--text-stat-lg);font-weight:300;line-height:1.1}
.stat .l{font-size:var(--text-meta);color:var(--ink-3);margin-top:2px}
.stat .v.pos{color:var(--positive)}.stat .v.att{color:var(--caution)}
.lead{display:flex;gap:16px;align-items:flex-start;margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
.lead .big{font-size:var(--text-display);font-weight:300;line-height:1;min-width:60px}
.lead p{font-size:var(--text-lead);color:var(--ink-2)}
.narrow{max-width:760px}
.src{margin-top:10px;border-left:2px solid var(--ink);padding:8px 12px;background:var(--subtle);font-size:var(--text-body);color:var(--ink-2)}
.src b{color:var(--ink);font-weight:600}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--subtle)}tr.sel td{background:var(--selected)}
.ask{margin-top:16px}
.ask input{height:40px;width:100%;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;font-size:var(--text-lead);color:var(--ink);border-radius:var(--radius)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--subtle);padding:4px 10px;font-size:var(--text-meta);color:var(--ink-2);border-radius:var(--radius);cursor:pointer}
.answer{margin-top:12px;border:1px solid color-mix(in srgb,var(--agent) 30%,transparent);background:color-mix(in srgb,var(--agent-soft) 40%,var(--surface));padding:12px 14px;border-radius:var(--radius);font-size:var(--text-lead);line-height:1.6}
.answer .s{margin-top:8px;font-size:var(--text-caption);color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:var(--radius);font-size:var(--text-body);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.hidden{display:none !important}
.rev{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:var(--text-meta);color:var(--ink-3)}
.rev details{margin-top:8px}.rev summary{cursor:pointer;color:var(--ink-2)}
.rev ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:var(--text-body);max-width:720px}

/* analysis figure: two or three bars to one scale, every value printed */
.fig{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface)}
.fig .cap{font-size:var(--text-caption);color:var(--ink-3);margin-bottom:8px}
.fig .bar{display:grid;grid-template-columns:92px 1fr auto;gap:8px 12px;align-items:center;font-size:var(--text-body);margin-top:6px}
.fig .bar .l{color:var(--ink-2)}
.fig .bar .t{height:10px;background:var(--subtle);border-radius:var(--radius);position:relative;overflow:hidden}
.fig .bar .t i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.fig .bar .t i.extra{background:var(--caution)}
.fig .bar .t i.gap{background:var(--critical)}
.fig .bar .v{font-size:var(--text-meta);color:var(--ink-2);white-space:nowrap}
.fig .verdict{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--text-lead);font-weight:600}
.fig .verdict.c{color:var(--caution)}.fig .verdict.f{color:var(--critical)}.fig .verdict.p{color:var(--positive)}

/* agent pipeline and trace */
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pipe .ag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;font-size:var(--text-meta);color:var(--ink-2);background:var(--surface)}
.pipe .ag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--positive)}
.pipe .ag.stop{border-color:var(--caution);color:var(--ink);background:var(--caution-soft)}
.pipe .ag.stop i{background:var(--caution)}
.pipe .ag.done i{background:var(--positive)}
.pipe .ag.off{opacity:.45}
.pipe .arrow{align-self:center;color:var(--ink-3);font-size:var(--text-meta)}
.trace{margin-top:14px;border-left:1px solid var(--line);padding-left:0;list-style:none;margin-left:10px}
.trace li{position:relative;padding:0 0 14px 20px}
.trace li:last-child{padding-bottom:0}
.trace li::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--agent);border:2px solid var(--surface)}
.trace li.stop::before{background:var(--caution)}
.trace li.you::before{background:var(--advisor)}
.trace .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.trace .nm{font-size:var(--text-caption);font-weight:600;color:var(--agent);letter-spacing:.03em;text-transform:uppercase}
.trace li.stop .nm{color:var(--caution)}
.trace li.you .nm{color:var(--advisor)}
.trace .at{font-size:var(--text-caption);color:var(--ink-3)}
.trace .did{font-size:var(--text-body);color:var(--ink);margin-top:2px;line-height:1.5}
.trace .did b{font-weight:600}
.trace details{margin-top:6px;font-size:var(--text-meta)}
.trace summary{cursor:pointer;color:var(--ink-3);text-decoration:underline;text-decoration-color:var(--line)}
.trace .ev{margin-top:6px;border:1px solid var(--line);border-radius:var(--radius);background:var(--subtle);padding:8px 10px}
.trace .ev dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.trace .ev dt{color:var(--ink-3)}.trace .ev dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.trace .ev pre{margin:6px 0 0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--text-caption);color:var(--ink-2);line-height:1.5}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-caption);color:var(--ink-3)}
.conf i{display:inline-block;width:40px;height:5px;background:var(--subtle);border-radius:3px;position:relative;overflow:hidden}
.conf i b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.conf.lo i b{background:var(--caution)}
.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px;max-width:960px}
.agents .a{border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0}
.agents .a .n{font-size:var(--text-caption);font-weight:600;color:var(--agent);text-transform:uppercase;letter-spacing:.03em}
.agents .a .v{font-size:var(--text-stat);font-weight:300;line-height:1.1;margin-top:4px}
.agents .a .l{font-size:var(--text-meta);color:var(--ink-3);margin-top:2px}
@media(max-width:960px){.agents{grid-template-columns:repeat(2,1fr)}}
/* three beats */
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.beat{border-top:2px solid var(--line);padding-top:10px;min-width:0}
.beat.on{border-top-color:var(--ink)}
.beat .n{font-size:var(--text-caption);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.beat .x{margin-top:4px;font-size:var(--text-body);color:var(--ink)}
/* opener meter */
.meter{margin-top:20px;max-width:720px}
.meter .track{display:flex;height:14px;border-radius:var(--radius);overflow:hidden;gap:2px}
.meter .track i{display:block;height:100%}
.meter .leg{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:var(--text-body);color:var(--ink-2)}
.meter .leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.col>h2 .num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:var(--text-caption);align-items:center;justify-content:center;font-weight:600}
.cols{gap:28px;margin-top:28px}
.say{margin-top:14px}
h1.t{font-size:var(--text-title)}
.after{margin-top:14px;font-size:var(--text-body);color:var(--ink-2)}
@media(max-width:960px){.beats{grid-template-columns:1fr}}
@media(max-width:960px){.cols{grid-template-columns:1fr}.top{padding:0 16px}main{padding:20px 16px 60px}.b{width:auto}.prog span{display:none}}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<script>

'use strict';
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function n(v){ return Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function n0(v){ return Math.abs(v).toLocaleString('en-US'); }
function amt(v){ return v<0?'('+n(v)+')':n(v); }
function who(w,l){ return '<span class="who '+w+'"><i></i>'+(l||{agent:'Clearline',you:'You',client:'Client'}[w])+'</span>'; }
function toast(m){ var t=el('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2000); }

// ---------- material (fictional) ----------
var CASES=[
 {id:'dup',title:'Bayfront paid twice',
  stmt:{title:'Bank statement, Fund IV operating account',sub:'29 Sep 2026, lines 85 to 89',rows:[[85,'29 Sep','INCOMING WIRE ALDER FAMILY OFFICE LTD REF MGP IV CC-009 LP-0112',340000,'ok'],[86,'29 Sep','INCOMING WIRE KESTREL TEACHERS RETIREMENT REF CC-009 LP-0118',615000,'ok'],[87,'29 Sep','INCOMING WIRE BAYFRONT SEC PRIM VII LP CC-009',1250000,'hl'],[88,'29 Sep','INCOMING WIRE BAYFRONT SEC PRIM VII LP CC-009',1250000,'hl'],[89,'29 Sep','INCOMING WIRE NORDVIK PENSJON AS REF CC009',2499965,'']]},

  agents:[
   {n:'Intake',at:'06:40:12',did:'Read the bank feed: <b>183 lines</b>, 29 to 30 Sep. Filed lines 87 and 88 against Fund IV. Both carry the same end-to-end reference.',ev:[['Source','Harbor National bank feed, MT940, 30 Sep 06:40'],['Lines 87 and 88','UETR 7f3a…c91e on both; same ordering bank, same time stamp 29 Sep 14:02 and 14:03']]},
   {n:'Matching',at:'06:40:31',did:'Matched line 87 to <b>LP-0096 Bayfront</b>: amount equals the call exactly, payer name agrees. Line 88: same payer, amount and date as 87, and LP-0096 is already satisfied, so flagged <b>possible duplicate</b>.',conf:0.58,ev:[['Rule','Investor reference in the wire, then exact amount, then payer name'],['Call notice CC-009','LP-0096 · 1,250,000 · due 29 Sep · reference "MGP IV CC-009 LP-0096"'],['Why 0.58','A second identical receipt is a duplicate about 9 times in 10 on this book; the tenth is a second call the agent cannot see']]},

 {id:'name',title:'Two investors, one name',

  say:'Line 179 says "Foundation" but carries <b>no investor reference</b>. The Foundation was asked for 250,000 and has paid it. The Endowment was asked for <b>exactly 2,000,000</b> and has not. The amount decides. Same mix-up on call six.',
  entry:{hd:'Proposed for line 179',ln:[['Dr 1000 Cash','2,000,000.00'],['Cr 1200 Contributions receivable, LP-0041 Endowment','2,000,000.00']]},
  agents:[

var TOTAL=CASES.length+3; // intro, 4 cases, statement, client
function go(s){ state.step=s; state.prov=null; render(); window.scrollTo({top:0}); }
function render(){ var c=el('content'); var s=state.step; el('back').classList.toggle('hidden',s===0); var lbl=s===0?'Overnight':s<=CASES.length?'Case '+s+' of '+CASES.length:s===CASES.length+1?'Statement':'Client'; el('prog').innerHTML='<span>'+lbl+'</span>'+Array.apply(null,{length:TOTAL}).map(function(_,i){return '<i class="'+(i<=s?'on':'')+'"></i>';}).join(''); c.innerHTML=s===0?intro():s<=CASES.length?caseView(CASES[s-1],s):s===CASES.length+1?statement():client(); wire(c); }

function intro(){ return '<div class="narrow"><h1 class="t">183 wires came in overnight.</h1><p class="sub">Fund IV, September capital call. Clearline matched each wire to an investor and booked it.</p><div class="meter"><div class="track"><i style="width:97.3%;background:var(--positive)"></i><i style="width:2.2%;background:var(--caution)"></i><i style="width:.5%;background:var(--line-strong)"></i></div><div class="leg"><span><b style="background:var(--positive)"></b>179 matched and booked, no person involved</span><span><b style="background:var(--caution)"></b>4 need you</span><span><b style="background:var(--line-strong)"></b>1 late, arrives tomorrow</span></div></div><div class="agents"><div class="a"><p class="n">Intake agent</p><p class="v tnum">183</p><p class="l">bank lines read and filed; 1 duplicate document suppressed</p></div><div class="a"><p class="n">Matching agent</p><p class="v tnum">182</p><p class="l">lines matched to an investor, the call, the facility or the fee</p></div><div class="a"><p class="n">Reconciliation agent</p><p class="v tnum">4</p><p class="l">differences explained with a cause; cash ties to the cent</p></div><div class="a"><p class="n">Posting agent</p><p class="v tnum">179</p><p class="l">entries posted above the 0.90 threshold; 4 held for a person</p></div></div><div class="lead"><p>Four narrow agents, each with a name, a job and a confidence. Where one stops, you start. '+who('you','Priya Naidoo, fund accountant')+'</p></div><div style="margin-top:24px;max-width:280px"><button class="b pri" data-go="1">See the first</button></div><p class="hint">About two minutes.</p></div>'; }

function stmtTable(st,done){ return '<div class="doc"><div class="hd"><b>'+st.title+'</b><span>'+st.sub+'</span></div><div class="tscroll"><table class="tnum"><tr><th>Line</th><th>Date</th><th>Description</th><th class="num">Amount</th></tr>'+st.rows.map(function(r){ var cls=r[4]==='hl'?(done?'ok':'hl'):r[4]; return '<tr class="'+cls+'"><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="desc">'+esc(r[2])+'</td><td class="num">'+amt(r[3])+'</td></tr>'; }).join('')+'</table></div></div>'; }
function recCard(r){ return '<div class="rec'+(r.pick?' pick':'')+'"><span class="tag '+r.tag[1]+'">'+r.tag[0]+'</span><p class="nm">'+r.nm+'</p><dl>'+r.kv.map(function(k){return '<dt>'+k[0]+'</dt><dd>'+k[1]+'</dd>';}).join('')+'</dl></div>'; }
function entryBox(e,status){ return '<div class="entry '+status+'"><div class="hd">'+(status==='posted'?'Posted through the ledger\'s validation':e.hd)+'</div>'+e.ln.map(function(l){return '<div class="ln"><span>'+l[0]+'</span><span class="tnum">'+l[1]+'</span></div>';}).join('')+'</div>'; }
function fig(f,done){ var max=Math.max.apply(null,f.bars.map(function(b){return Math.max(b[1],b[2]);})); return '<div class="fig"><p class="cap">'+f.cap+'</p>'+f.bars.map(function(b){ var base=Math.min(b[1],b[2]); var w=Math.round(b[1]/max*100); var wb=Math.round(base/max*100); var ex=b[3]; var inner=ex==='extra'?'<i style="width:'+wb+'%"></i><i class="extra" style="left:'+wb+'%;width:'+(w-wb)+'%"></i>':ex==='gap'?'<i style="width:'+w+'%"></i><i class="gap" style="left:'+w+'%;width:'+Math.max(1,Math.round((b[2]-b[1])/max*100))+'%"></i>':'<i style="width:'+w+'%"></i>'; return '<div class="bar"><span class="l">'+b[0]+'</span><span class="t">'+inner+'</span><span class="v tnum">'+n0(b[1])+'</span></div>'; }).join('')+'<p class="verdict '+(done?'p':f.verdict[1])+'">'+(done?'Settled':f.verdict[0])+'</p></div>'; }
function beats(k,d){ var labels=['Spotted','Checked','Your call']; return '<div class="beats">'+k.beats.map(function(b,i){ return '<div class="beat'+((i===2&&!d)||(d&&i===2)?' on':'')+'"><p class="n">'+(i+1)+' · '+labels[i]+'</p><p class="x">'+(i===2&&d?(d==='done'?'Done: '+k.btn:'Declined; handled manually'):b)+'</p></div>'; }).join('')+'</div>'; }
function confHtml(c){ return '<span class="conf'+(c<0.9?' lo':'')+'"><i><b style="width:'+Math.round(c*100)+'%"></b></i>'+c.toFixed(2)+'</span>'; }
function pipe(k,d){ var names=['Intake','Matching','Reconciliation','Posting']; return '<div class="pipe">'+names.map(function(nm,i){ var a=k.agents[i]; var cls=d?'done':(a.stop?'stop':'done'); return (i?'<span class="arrow">→</span>':'')+'<span class="ag '+cls+'"><i></i>'+nm+(a.stop&&!d?': needs you':'')+'</span>'; }).join('')+'</div>'; }
function trace(k,d){ return '<ol class="trace">'+k.agents.map(function(a){ return '<li class="'+(a.stop&&!d?'stop':'')+'"><div class="hd"><span class="nm">'+a.n+' agent</span><span class="at">'+a.at+'</span>'+(a.conf!=null?confHtml(a.conf):'')+'</div><p class="did">'+a.did+'</p><details><summary>What it read and why</summary><div class="ev"><dl>'+a.ev.map(function(e){return '<dt>'+e[0]+'</dt><dd>'+e[1]+'</dd>';}).join('')+'</dl></div></details></li>'; }).join('')+(d?'<li class="you"><div class="hd"><span class="nm">Priya Naidoo</span><span class="at">now</span></div><p class="did">'+(d==='done'?'Accepted: '+k.btn+'. Posted through the ledger\'s validation with her name.':'Declined. Handled manually; counted as an override.')+'</p></li>':'')+'</ol>'; }
function caseView(k,i){ var d=state.done[k.id]; var next=i<CASES.length?i+1:CASES.length+1;
  return '<h1 class="t">'+k.title+'</h1><p class="sub">Case '+i+' of '+CASES.length+' · '+who('you','Priya Naidoo, fund accountant')+'</p>'+beats(k,d)+
  '<div class="cols"><div class="col"><h2><span class="num">1</span>What came in</h2>'+stmtTable(k.stmt,!!d)+'</div>'+

  '<div class="col"><h2><span class="num">3</span>Your call</h2>'+(d?'<div class="done"><b>'+(d==='done'?'Recorded':'Declined')+'</b>'+(d==='done'?'With your name. Nothing was sent.':'Nothing was posted.')+'</div><p class="after">'+(d==='done'?k.after:'Counted as an override for the evals.')+'</p><div class="next"><button class="b pri" data-go="'+next+'">'+(i<CASES.length?'Next case':'Go to the statements')+'</button></div>':'<button class="b pri" data-do="'+k.id+'">'+k.btn+'</button><button class="b" data-decline="'+k.id+'">'+k.alt+'</button><p class="hint">Nothing sends. Your decision is recorded with your name.</p>')+'</div></div>'; }

function statement(){ var src=state.prov!=null?SRC[LP[state.prov][3]]:'';

  '<div class="doc" style="margin-top:20px"><div class="hd"><b>Capital account statement · Nordvik Pensjon AS</b><span>Quarter to 30 Sep 2026, USD</span></div><div class="tscroll"><table class="tnum"><tr><th></th><th class="num">This quarter</th><th class="num">Since inception</th></tr>'+LP.map(function(r,i){ var bold=/Closing/.test(r[0]); return '<tr class="clk'+(state.prov===i?' sel':'')+'" data-prov="'+i+'"><td>'+(bold?'<strong>':'')+r[0]+(bold?'</strong>':'')+'</td><td class="num">'+(r[1]==null?'':(r[1]<0?'('+n0(r[1])+')':n0(r[1])))+'</td><td class="num">'+(r[2]==null?'':(r[2]<0?'('+n0(r[2])+')':n0(r[2])))+'</td></tr>'; }).join('')+'</table></div></div>'+(src?'<div class="src">'+src+'</div>':'<p class="hint">Try "Contributions" or "Fee offsets": both come from cases you just settled.</p>')+

var QA={fund:{a:'179 of 180 investors funded the September call by 29 September. Carraway Family Holdings, 500,000, arrived a day late and is recorded. Two things were unusual and are settled: Bayfront paid twice and the duplicate is being refunded; a 2,000,000 payment from Stratton University Endowment came without a reference and was matched by amount.',s:'capital call CC-009; bank lines 87, 88, 179; reconciliation'},nordvik:{a:'Nordvik Pensjon holds 5.88% of Fund IV on a 50,000,000 commitment. The September call of 2,500,000 was received on 29 September, 35 short because of a bank fee the fund absorbed. Closing balance this quarter 35,104,435; unfunded commitment 16,500,000.',s:'investor record LP-0023; bank line 89; Q3 statement'},fee:{a:'The Q4 management fee is 4,250,000 gross and 4,237,500 after a 12,500 director-fee offset from Bramblewood. The manager was paid gross on 30 September; the 12,500 is recorded as owed back and comes off next quarter.',s:'fee invoice 15 Sep; offset schedule v7; bank line 181'}};
function client(){ var t=state.q;
  return '<div class="narrow"><h1 class="t">Friday, 9:05am. The client asks.</h1><p class="sub">'+who('client','Daniel Kerr, CFO of the fund manager')+' His managing partner wants to know who has not paid. He asks the portal, not the administrator.</p>'+
  '<div class="ask"><input id="q" placeholder="Who has not funded the September call?" aria-label="Your question"><div class="chips"><button class="chip" data-q="fund">Who has not funded?</button><button class="chip" data-q="nordvik">Nordvik\'s position</button><button class="chip" data-q="fee">The management fee</button></div>'+(t?'<div class="answer">'+who('agent','Clearline')+' '+QA[t].a+'<p class="s">Sources: '+QA[t].s+'</p></div>':'')+'</div>'+
  (t?'<div class="lead"><p>The answer is the data Priya settled and Anna signed, with the plumbing removed. The operations work earns the trust; this page is what the client pays for.</p></div><div style="margin-top:20px;max-width:200px"><button class="b" data-go="0">Start again</button></div>':'')+
  '<div class="rev">For reviewers<details><summary>How it is governed</summary><ul><li>Clearline books a wire without a person only above a confidence threshold the controller sets per fund. A new fund starts with every wire going to a person.</li><li>Refunds, payment-instruction changes, KYC ratings and statement release are never automatic, whatever the confidence.</li><li>Nothing writes to the ledger directly. Every entry goes through the accounting system\'s own validation.</li><li>Every decision is logged with the person, the agent version and the inputs. Declines count as overrides; a rising override rate blocks loosening the threshold.</li></ul></details><details><summary>Who else is near this</summary><ul><li>Document extraction and portal chatbots are crowded. Reconciliation agents exist for hedge-fund trades and for one administrator\'s own funds. Statement review exists after the fact, sold to fund managers to check their administrator.</li><li>Nobody runs one audited chain from the bank line through booking, reconciliation and signed statements inside the administrator, then gives the clean data back to the client. That seam is the product.</li></ul></details><p style="margin-top:8px">Prototype on synthetic data. Fund, investors and people are fictional.</p></div></div>'; }

function wire(c){ c.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ go(+b.dataset.go); }); }); c.querySelectorAll('[data-do]').forEach(function(b){ b.addEventListener('click',function(){ state.done[b.dataset.do]='done'; toast('Recorded with your name. Nothing was sent.'); render(); }); }); c.querySelectorAll('[data-decline]').forEach(function(b){ b.addEventListener('click',function(){ state.done[b.dataset.decline]='declined'; toast('Declined. Counted as an override.'); render(); }); }); c.querySelectorAll('[data-prov]').forEach(function(tr){ tr.addEventListener('click',function(){ state.prov=+tr.dataset.prov; render(); }); }); c.querySelectorAll('[data-q]').forEach(function(ch){ ch.addEventListener('click',function(){ state.q=ch.dataset.q; render(); }); }); var q=c.querySelector('#q'); if(q) q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var v=q.value.toLowerCase(); state.q=/nordvik/.test(v)?'nordvik':/fee/.test(v)?'fee':'fund'; render(); } }); }

document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&state.step>0) go(state.step-1); });
go(0);
