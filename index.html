<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clearline: agentic fund operations for private markets. Agents propose, people release. A product demo on synthetic data.">
<title>Clearline Fund Ops</title>
</head>

<style>
/* Clearline, linear edition, on the Relay design system (tokens verbatim from app/tokens.css).
   One path, five steps, one action per screen. Reading column 720px. Hairlines, not cards. Colour only for status. */
:root {
  --ink: #1a1a1a; --ink-2: #5c5c5c; --ink-3: #686868; --line: #e4e2dd; --line-strong: #bcb9b2;
  --surface: #ffffff; --subtle: #f6f5f2; --selected: #ecebe6;
  --critical: #b3121f; --critical-soft: #fbecec; --positive: #2d6a4f; --positive-soft: #e9f2ed; --caution: #7a5200; --caution-soft: #faf3e1;
  --agent: #4a3f9a; --agent-soft: #edeaf7; --advisor: #0f5a8a; --advisor-soft: #e6f0f7; --client: #0e6b5e; --client-soft: #e4f1ee;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; --radius: 2px; --radius-lg: 8px;
  --text-caption: 11px; --text-meta: 12px; --text-body: 13px; --text-lead: 14px; --text-brief: 15px; --text-heading: 16px; --text-brand: 17px; --text-stat: 20px; --text-stat-lg: 24px; --text-title: 28px; --text-display: 30px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{font-family:var(--font)}
body{margin:0;background:var(--surface);color:var(--ink);font-size:var(--text-lead);line-height:1.5;padding-block:0;padding-inline:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink);text-underline-offset:3px}
button{font:inherit}
h1,h2,h3,p{margin:0}
.meta{font-size:var(--text-meta)}.body{font-size:var(--text-body)}.caption{font-size:var(--text-caption)}.ink2{color:var(--ink-2)}.ink3{color:var(--ink-3)}.semi{font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;height:56px;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:var(--surface);padding:0 24px}
.brand{font-size:var(--text-brand);font-weight:600;letter-spacing:-.01em}
.steps{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:var(--text-meta);color:var(--ink-3)}
.steps i{display:inline-block;width:22px;height:2px;background:var(--line-strong)}
.steps i.on{background:var(--ink)}
.proto{font-size:var(--text-meta);color:var(--ink-3);white-space:nowrap}
main{padding:40px 24px 80px}
.col{max-width:720px;margin:0 auto}
.col.wide{max-width:960px}
.who{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius);padding:0 6px;font-size:var(--text-caption);font-weight:500;margin-right:8px;vertical-align:middle}
.who i{display:inline-block;width:6px;height:6px;border-radius:50%}
.who.agent{background:var(--agent-soft);color:var(--agent)}.who.agent i{background:var(--agent)}
.who.you{background:var(--advisor-soft);color:var(--advisor)}.who.you i{background:var(--advisor)}
.who.client{background:var(--client-soft);color:var(--client)}.who.client i{background:var(--client)}
.persona{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border:1px solid var(--line);background:var(--subtle);padding:8px 12px;border-radius:var(--radius);font-size:var(--text-meta);color:var(--ink-2);margin-bottom:24px}
.persona b{color:var(--ink);font-weight:500}
h1.t{font-size:var(--text-title);font-weight:300;line-height:1.15;letter-spacing:-.01em}
p.sub{margin-top:8px;color:var(--ink-2)}
.brief{margin:28px 0;border:1px solid color-mix(in srgb,var(--agent) 30%,transparent);background:color-mix(in srgb,var(--agent-soft) 40%,var(--surface));border-radius:var(--radius-lg);padding:20px;display:flex;gap:12px}
.brief .av{display:inline-flex;height:36px;width:36px;flex:none;align-items:center;justify-content:center;border-radius:50%;background:var(--agent-soft);color:var(--agent);margin-top:2px}
.brief .nm{font-size:var(--text-meta);color:var(--ink-3)}.brief .nm b{color:var(--agent);font-weight:500}
.brief .says{margin-top:4px;font-size:var(--text-brief);line-height:1.6}
.b{display:inline-flex;min-height:36px;align-items:center;border-radius:var(--radius);padding:6px 14px;line-height:1.3;font-size:var(--text-lead);border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.b:hover{background:var(--subtle)}
.b.pri{background:var(--ink);color:var(--surface)}.b.pri:hover{opacity:.85;background:var(--ink)}
.b[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:28px}
.actions .hint{font-size:var(--text-meta);color:var(--ink-3)}
.pill{display:inline-block;white-space:nowrap;border-radius:var(--radius);padding:0 6px;font-size:var(--text-meta);line-height:16px;font-weight:500;vertical-align:middle}
.pill.n{background:var(--subtle);color:var(--ink-2)}.pill.p{background:var(--positive-soft);color:var(--positive)}.pill.f{background:var(--critical-soft);color:var(--critical)}.pill.c{background:var(--caution-soft);color:var(--caution)}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-meta);color:var(--ink-2);white-space:nowrap}
.dot i{display:inline-block;height:8px;width:8px;border-radius:50%}
.dot.clear i{background:var(--positive)}.dot.att i{background:var(--caution)}.dot.block i{background:var(--critical)}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-top:20px}
.card .k{font-size:var(--text-meta);color:var(--ink-3);margin-bottom:4px}
.card .story{font-size:var(--text-heading);line-height:1.5}
.card .found,.card .prop{margin-top:16px;font-size:var(--text-lead);line-height:1.55}
.card .found b,.card .prop b{font-weight:600}
.counter{font-size:var(--text-meta);color:var(--ink-3);margin-top:8px}
details.why{margin-top:16px;font-size:var(--text-body)}
details.why summary{cursor:pointer;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line-strong)}
details.why>div{margin-top:10px;border-left:1px solid var(--line);padding-left:12px;color:var(--ink-2)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--text-body);margin:0}
dl.kv dt{color:var(--ink-3)}dl.kv dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.rows{border:1px solid var(--line);border-radius:var(--radius);padding:0 16px;margin-top:20px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>svg{flex:none;margin-top:2px;color:var(--ink-3)}
.row.pos>svg{color:var(--positive)}.row.caut>svg{color:var(--caution)}.row.crit>svg{color:var(--critical)}
.row .bd{min-width:0;flex:1}
.row .t{display:block;font-size:var(--text-lead)}
.row .m{display:block;margin-top:2px;font-size:var(--text-meta);color:var(--ink-3)}
.row .r{flex:none;align-self:center}
.done{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--positive) 40%,transparent);background:var(--positive-soft);border-radius:var(--radius);padding:12px 14px;margin-top:20px;font-size:var(--text-body)}
.done svg{flex:none;color:var(--positive);margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:var(--text-body)}
th{border-bottom:1px solid var(--line-strong);padding:8px 12px;text-align:left;font-size:var(--text-meta);line-height:16px;font-weight:400;color:var(--ink-2)}
td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--subtle)}tr.sel td{background:var(--selected)}
.tscroll{overflow-x:auto;margin-top:20px}
.source{margin-top:12px;border-left:2px solid var(--ink);padding:8px 12px;background:var(--subtle);font-size:var(--text-body);color:var(--ink-2)}
.source b{color:var(--ink);font-weight:600}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.fc{border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.fc h3{font-size:var(--text-lead);font-weight:600}.fc p{margin-top:4px;font-size:var(--text-body);color:var(--ink-2)}
.fc.focus{box-shadow:inset 0 0 0 2px var(--ink)}
.ask{margin-top:24px}
.ask .q{display:flex;gap:8px}
.ask input{height:40px;flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;font-size:var(--text-lead);color:var(--ink);border-radius:var(--radius)}
.answer{margin-top:14px;border:1px solid color-mix(in srgb,var(--agent) 30%,transparent);background:color-mix(in srgb,var(--agent-soft) 40%,var(--surface));padding:14px 16px;border-radius:var(--radius);font-size:var(--text-lead);line-height:1.6}
.answer .src{margin-top:10px;font-size:var(--text-caption);color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--subtle);padding:4px 10px;font-size:var(--text-meta);color:var(--ink-2);border-radius:var(--radius);cursor:pointer}
.chip:hover{background:var(--selected)}
.section{margin-top:40px}
.section>h2{font-size:var(--text-brief);font-weight:600;margin-bottom:12px}
.princ{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.princ .p{border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.princ .p h3{font-size:var(--text-lead);font-weight:600}.princ .p p{margin-top:4px;font-size:var(--text-body);color:var(--ink-2)}
.gate{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;font-size:var(--text-body)}
.gate .k{color:var(--ink-2)}.gate .e{font-size:var(--text-meta);color:var(--ink-3);white-space:nowrap}
input[type=range]{width:140px;accent-color:var(--ink)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:var(--text-body)}
.bars .lb{color:var(--ink-2)}.bars .tr{height:1.5px;background:var(--line)}.bars .tr i{display:block;height:100%;background:var(--ink)}
.bars .vl{font-size:var(--text-meta);color:var(--ink-2);white-space:nowrap}
.timeline{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid var(--line)}
.timeline li{position:relative;padding-bottom:14px}.timeline li:last-child{padding-bottom:0}
.timeline li>span.ic{position:absolute;left:-31px;top:3px;display:flex;height:20px;width:20px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink-3)}
.timeline .at{display:block;font-size:var(--text-caption);color:var(--ink-3)}
.timeline .tt{display:block;font-size:var(--text-body)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:var(--radius);font-size:var(--text-body);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
.toast.show{opacity:1}
.hidden{display:none !important}
.back{font-size:var(--text-meta);color:var(--ink-3);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line-strong)}
@media(max-width:720px){.top{padding:0 16px}main{padding:24px 16px 60px}.cards3,.princ{grid-template-columns:1fr}.gate{grid-template-columns:1fr auto}.gate .e{grid-column:1/-1;white-space:normal}.proto,.steps span.lbl{display:none}.card{padding:18px}}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

function analyze(){ var seen={}; var out=[]; BANK.forEach(function(b){ var r={line:b,conf:0,flag:'',lp:null,kind:b.kind,status:'auto',dr:'',cr:'',tolAbs:0};
  if(b.kind==='facility'){ r.conf=0.98; r.dr='1000 Cash'; r.cr='2010 Facility payable'; }
  else if(b.kind==='investment'){ r.conf=0.95; r.dr='1100 Investments at cost'; r.cr='1000 Cash'; }
  else if(b.kind==='fee'){ r.conf=0.66; r.dr='5010 Management fee expense 4,250,000'; r.cr='1000 Cash 4,250,000'; r.flag='fee'; r.status='review'; }
  else { var m=/LP-\d{4}/.exec(b.desc); var idLp=m?LPBY[m[0]]:null; var amtLps=LPS.filter(function(l){return Math.abs(l.call-b.amt)<=100;}); var payer=b.desc.replace(/INCOMING WIRE/,'').replace(/REF.*$/,''); var nameLps=LPS.map(function(l){return {l:l,s:sim(payer,l.name)};}).filter(function(x){return x.s>=0.5;}).sort(function(a,b){return b.s-a.s;}); var cand=null;
    if(idLp&&Math.abs(idLp.call-b.amt)<=100){ cand=idLp; r.conf=0.99; } else if(idLp){ cand=idLp; r.conf=0.80; }
    else if(amtLps.length===1){ cand=amtLps[0]; var ns=sim(payer,cand.name); r.conf=ns>=0.5?0.93:0.74; if(nameLps.length&&nameLps[0].l.id!==cand.id&&nameLps[0].s>ns){ r.conf=0.74; r.flag='name'; } }
    else if(amtLps.length>1&&nameLps.length){ cand=nameLps[0].l; r.conf=0.85; } else if(nameLps.length){ cand=nameLps[0].l; r.conf=0.70; }
    if(cand){ r.lp=cand.id; var short=cand.call-b.amt; if(seen[cand.id]){ r.conf=Math.min(r.conf,0.58); r.flag='dup'; r.dr='1000 Cash '+fmt0(b.amt); r.cr='2310 Contributions received in advance, '+cand.id; }
      else { seen[cand.id]=b.n; if(short>0&&short<=state.gate.tol){ r.tolAbs=short; r.dr='1000 Cash; 5090 Bank charges '+fmt0(short); r.cr='1200 Contributions receivable, '+cand.id; } else if(short>0){ r.flag='short'; r.dr='1000 Cash '+fmt0(b.amt)+'; 5090 Bank charges '+fmt0(short); r.cr='1200 Contributions receivable, '+cand.id+' '+fmt0(cand.call); r.conf=0.97; r.status='review'; } else { r.dr='1000 Cash'; r.cr='1200 Contributions receivable, '+cand.id; } } }
    else { r.conf=0.3; r.flag='unknown'; r.status='review'; } }
  if(r.status!=='review'&&r.conf<state.gate.post) r.status='review'; var d=state.decisions[b.n]; if(d){ r.status=d.status; r.decision=d; } out.push(r); }); return out; }

  '<div class="done">'+ic('check',16)+'<span>This is the same data Priya settled and Anna signed, with the plumbing removed. The operations work earns the trust; the portal is what the client pays for.</span></div>'+
  '<div class="actions"><button class="b pri" data-go="5">Why it is built this way</button><button class="b" data-go="0">Start again</button></div>'; }

function answer(q){ q=q.toLowerCase(); var rec=received(); if(/nordvik/.test(q)){ var s=stmt(LPBY['LP-0023']); return {a:'Nordvik Pensjon holds 5.88% of Fund IV on a 50,000,000 commitment. The September call of 2,500,000 was received on 29 September, 35 short because of a bank fee the fund absorbed. Closing balance this quarter '+fmt0(s.q.end)+'; unfunded commitment '+fmt0(s.i.unfunded)+'.',src:'investor record LP-0023; capital call CC-009; bank line 22; Q3 statement'}; } if(/pension|type|who are/.test(q)){ var pp=LPS.filter(function(l){return l.type==='Public pension';}).sort(function(a,b){return b.commit-a.commit;}); var t=pp.reduce(function(s,l){return s+l.commit;},0); return {a:pp.length+' public pensions hold '+fmt0(t)+', '+(t/FUND.lpCommit*100).toFixed(1)+'% of investor commitments. The largest is '+pp[0].name+' at '+fmt0(pp[0].commit)+'.',src:'investor register, 180 records'}; } var unf=LPS.filter(function(l){return !rec[l.id];}); return {a:(180-unf.length)+' of 180 investors funded the September call by 29 September. '+(unf.length?unf.map(function(l){return l.name+', '+fmt0(l.call);}).join('; ')+' arrived a day late and is recorded. ':'')+'Two things were unusual and are settled: Bayfront paid twice and the duplicate is being refunded; a 2,000,000 payment from Stratton University Endowment came without a reference and was matched by amount. Nothing changes what you owe or are owed.',src:'capital call CC-009; bank feed to 1 October; reconciliation items B-1 to B-4'}; }

function s5(){ var autoN=ROWS.filter(function(r){return r.status==='auto';}).length; var q=ROWS.filter(function(r){return r.status==='review';}).length; var decided=Object.keys(state.decisions).length;
  var princ=[['One path, one decision per screen','Priya saw four cards, not a ledger. The 179 lines that settled inside policy were one sentence. Nobody hunts for the five that matter.'],['Propose and release','Every card says what happened, what the system found, what it proposes, and has one button. Money movement, KYC and statement release always need a named person.'],['Plain English first, evidence one click away','The story is in words a managing partner understands. Bank lines, ledger entries and confidence scores sit under "Show the evidence".'],['Every number has a source','Click any line on a statement and see the bank line, fee workbook or valuation pack behind it. Anna checks evidence, not arithmetic.'],['Hard rules beat soft scores','A refund needs a call-back whatever the confidence. A statement needs a named signer. These are controls, not model limits.'],['Trust is earned per fund','A new fund starts with every item going to a person. Thresholds loosen only as the fund\'s own history earns it, and each change is audited.'],['Write through the system of record','Nothing posts to the ledger directly. Every entry goes through the accounting system\'s own validation, so auditors see nothing new.'],['The client sees answers, not plumbing','Daniel\'s page has no breaks, thresholds or agent names. It has his funds, his call, and an answer that names its sources.']];
  return '<h1 class="t">Why it is built this way</h1><p class="sub">Fund administration is a trust business under regulation. The design question is where the person sits.</p><div class="princ" style="margin-top:24px">'+princ.map(function(p){return '<div class="p"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>';}).join('')+'</div>'+
  '<div class="section"><h2>Governance: thresholds a controller owns</h2><div class="gate"><span class="k">Post without a person when confidence is above</span><label><input type="range" id="g-post" min="50" max="99" value="'+Math.round(state.gate.post*100)+'"> <span class="tnum body" id="gv-post">'+state.gate.post.toFixed(2)+'</span></label><span class="e" id="ge-post">'+q+' lines to a person</span><span class="k">Absorb a bank-fee shortfall up to, USD</span><label><input type="range" id="g-tol" min="0" max="100" value="'+state.gate.tol+'"> <span class="tnum body" id="gv-tol">'+fmt0(state.gate.tol)+'</span></label><span class="e" id="ge-tol">'+ROWS.filter(function(r){return r.tolAbs;}).length+' absorbed automatically</span><span class="k">Refunds and payment-instruction changes</span><span class="body">Never automatic: call-back first</span><span></span><span class="k">Statement release</span><span class="body">Never automatic: named signer</span><span></span></div><p class="meta ink3" style="margin-top:10px">Move the second slider to 50 and Nordvik\'s 35 would have settled itself. Each change is itself an audited event.</p></div>'+
  '<div class="section"><h2>How the agents are doing on this fund</h2><div class="tscroll" style="margin-top:0"><table class="tnum"><tr><th>Agent</th><th class="num">Settled without a person</th><th class="num">Overridden by a person</th><th>Trend</th></tr><tr style="background:var(--subtle)"><td><strong>Posting, this close</strong></td><td class="num">'+(autoN/ROWS.length*100).toFixed(1)+'%</td><td class="num">'+state.overrides+' of '+decided+'</td><td>'+pill(state.overrides>2?'Review before loosening':'Inside bar',state.overrides>2?'c':'p')+'</td></tr>'+[['Intake','91%','1.2%','Stable','p'],['Posting, last 4 closes','89%','3.5%','Watch','c'],['Reconciliation','94%','6.0%','Improving','p'],['Reporting','98%','0.4%','Stable','p']].map(function(h){return '<tr><td>'+h[0]+'</td><td class="num">'+h[1]+'</td><td class="num">'+h[2]+'</td><td>'+pill(h[3],h[4])+'</td></tr>';}).join('')+'</table></div><div class="bars" style="margin-top:16px"><span class="lb">Days to close, Q4 2025</span><span class="tr"><i style="width:100%"></i></span><span class="vl">9</span><span class="lb">Q1 2026</span><span class="tr"><i style="width:78%"></i></span><span class="vl">7</span><span class="lb">Q2 2026</span><span class="tr"><i style="width:67%"></i></span><span class="vl">6</span><span class="lb">Q3 2026</span><span class="tr"><i style="width:56%"></i></span><span class="vl">5, target</span></div><p class="caption ink3" style="margin-top:8px">History figures are illustrative targets. The live row is computed from what you did in this session.</p></div>'+
  '<div class="section"><h2>Audit log</h2><ol class="timeline">'+state.audit.map(function(a){return '<li><span class="ic">'+ic(a.who==='agent'?'agent':'people',16)+'</span><span class="at tnum">'+a.t+'</span><span class="tt">'+who(a.who)+esc(a.agent)+': '+esc(a.what)+' · '+esc(a.by)+'</span></li>';}).join('')+'</ol></div>'+
  '<div class="section"><h2>Who else is near this</h2><p class="body ink2">Document extraction and portal chatbots are crowded. Reconciliation agents exist for hedge-fund trades and for one administrator\'s own funds. Statement review exists after the fact, sold to fund managers to check their administrator. Nobody runs one audited chain from intake through posting, reconciliation and pre-release review inside the administrator, and then gives the clean data back to the client. That seam is the product.</p></div>'+
  '<div class="actions"><button class="b pri" data-go="0">Start again</button></div>'; }

function wire(c){ c.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ go(+b.dataset.go); }); });
  c.querySelectorAll('[data-settle]').forEach(function(b){ b.addEventListener('click',function(){ var it=items().find(function(i){return String(i.key)===b.dataset.settle;}); if(it){ settle(it); toast('Recorded with your name. Nothing was sent.'); render(); window.scrollTo({top:0}); } }); });
  c.querySelectorAll('[data-decline]').forEach(function(b){ b.addEventListener('click',function(){ var n=+b.dataset.decline; state.decisions[n]={status:'rejected',by:'Priya Naidoo'}; state.overrides++; audit('Posting','proposal declined, handled manually','Priya Naidoo','you'); toast('Declined; counted as an override for the evals.'); render(); window.scrollTo({top:0}); }); });
  c.querySelectorAll('[data-val]').forEach(function(b){ b.addEventListener('click',function(){ state.valuation=true; audit('Reporting','valuation committee sign-off recorded','Anna Reyes','you'); state.released=true; audit('Reporting','180 statements released','Anna Reyes, named signer','you'); toast('Signed. 180 statements released.'); go(3); }); });
  c.querySelectorAll('[data-release]').forEach(function(b){ b.addEventListener('click',function(){ state.released=true; audit('Reporting','180 statements released','Anna Reyes, named signer','you'); toast('Signed. 180 statements released.'); go(3); }); });
  c.querySelectorAll('[data-prov]').forEach(function(tr){ tr.addEventListener('click',function(){ state.prov=+tr.dataset.prov; render(); }); });
  var lp=c.querySelector('#lp'); if(lp) lp.addEventListener('change',function(){ state.lp=lp.value; state.prov=null; render(); });
  var qf=c.querySelector('#qf'); if(qf){ qf.addEventListener('submit',function(e){ e.preventDefault(); var q=c.querySelector('#q').value.trim(); if(!q) return; var a=answer(q); state.turns.push({q:q,a:a.a,src:a.src}); render(); }); c.querySelectorAll('.chip[data-q]').forEach(function(ch){ ch.addEventListener('click',function(){ var a=answer(ch.dataset.q); state.turns.push({q:ch.dataset.q,a:a.a,src:a.src}); render(); }); }); }
  [['g-post','post'],['g-tol','tol']].forEach(function(x){ var inp=c.querySelector('#'+x[0]); if(!inp) return; inp.addEventListener('input',function(){ if(x[1]==='tol') state.gate.tol=+inp.value; else state.gate.post=inp.value/100; recompute(); el('gv-post').textContent=state.gate.post.toFixed(2); el('gv-tol').textContent=fmt0(state.gate.tol); el('ge-post').textContent=ROWS.filter(function(r){return r.status==='review';}).length+' lines to a person'; el('ge-tol').textContent=ROWS.filter(function(r){return r.tolAbs;}).length+' absorbed automatically'; }); inp.addEventListener('change',function(){ audit('Fund controller','threshold changed: '+x[1]+' to '+(x[1]==='tol'?inp.value:(inp.value/100).toFixed(2)),'Anna Reyes','you'); }); }); }
el('back').addEventListener('click',function(){ if(state.step>0) go(state.step-1); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&state.step>0) go(state.step-1); });
go(0);
})();
