<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clearline: agentic fund operations for a private-markets fund administrator. A Luxembourg RAIF, one capital call, four agents, people release. A product demo on synthetic data.">
<title>Clearline Fund Ops</title>
</head>
<body>
<style>
/* Clearline, material-first. Relay tokens verbatim. One screen per case: what came in | what the agents did | what you decide. */
:root{--ink:#1a1a1a;--ink-2:#5c5c5c;--ink-3:#686868;--line:#e4e2dd;--line-strong:#bcb9b2;--surface:#ffffff;--subtle:#f6f5f2;--selected:#ecebe6;--critical:#b3121f;--critical-soft:#fbecec;--positive:#2d6a4f;--positive-soft:#e9f2ed;--caution:#7a5200;--caution-soft:#faf3e1;--agent:#4a3f9a;--agent-soft:#edeaf7;--advisor:#0f5a8a;--advisor-soft:#e6f0f7;--client:#0e6b5e;--client-soft:#e4f1ee;--font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;--radius:2px;--radius-lg:8px;--text-caption:11px;--text-meta:12px;--text-body:13px;--text-lead:14px;--text-brief:15px;--text-heading:16px;--text-brand:17px;--text-stat:20px;--text-stat-lg:24px;--text-title:28px;--text-display:30px;color-scheme:light}
*{box-sizing:border-box}
html{font-family:var(--font)}
body{margin:0;background:var(--surface);color:var(--ink);font-size:var(--text-lead);line-height:1.5}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit}
h1,h2,h3,p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);color:var(--ink-3)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;height:56px;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:var(--surface);padding:0 24px}
.brand{font-size:var(--text-brand);font-weight:600;letter-spacing:-.01em}
.about{margin-left:auto;display:flex;gap:4px;font-size:var(--text-meta)}
.about a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:var(--radius);padding:4px 10px;background:var(--subtle);white-space:nowrap}.about a:hover{border-color:var(--ink)}
@media(max-width:600px){.about{gap:3px}.about a{padding:4px 7px;font-size:var(--text-caption)}.prog span{display:none}}
.prog{display:flex;align-items:center;gap:8px;font-size:var(--text-meta);color:var(--ink-3)}
.prog i{display:inline-block;width:22px;height:2px;background:var(--line-strong)}.prog i.on{background:var(--ink)}
.back{font-size:var(--text-meta);color:var(--ink-3);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line-strong)}
main{padding:32px 24px 72px}
.wrap{max-width:1240px;margin:0 auto}
h1.t{font-size:var(--text-title);font-weight:300;line-height:1.15;letter-spacing:-.01em}
.sub{margin-top:6px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:1.2fr 1.1fr .8fr;gap:28px;margin-top:28px;align-items:start}
.col{min-width:0}
.col>h2{font-size:var(--text-caption);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.col>h3{font-size:var(--text-caption);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.col>h2 .num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:var(--text-caption);align-items:center;justify-content:center;font-weight:600}
.who{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius);padding:0 6px;font-size:var(--text-caption);font-weight:500;text-transform:none;letter-spacing:0}
.who i{display:inline-block;width:6px;height:6px;border-radius:50%}
.who.agent{background:var(--agent-soft);color:var(--agent)}.who.agent i{background:var(--agent)}
.who.you{background:var(--advisor-soft);color:var(--advisor)}.who.you i{background:var(--advisor)}
.who.client{background:var(--client-soft);color:var(--client)}.who.client i{background:var(--client)}
/* documents */
.doc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.doc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line-strong);font-size:var(--text-meta);color:var(--ink-2)}
.doc .hd b{color:var(--ink);font-weight:600;font-size:var(--text-body)}
table{width:100%;border-collapse:collapse;font-size:var(--text-body)}
th{padding:6px 12px;text-align:left;font-size:var(--text-caption);font-weight:400;color:var(--ink-3);border-bottom:1px solid var(--line)}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.dt{white-space:nowrap}
td.desc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--text-meta);letter-spacing:-.01em;color:var(--ink-2)}
tr.hl td{background:var(--caution-soft)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--caution)}
tr.ok td{background:var(--positive-soft)}
.tscroll{overflow-x:auto}
.rec{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-top:10px;font-size:var(--text-body)}
.rec .nm{font-weight:600;font-size:var(--text-lead)}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:var(--text-meta)}
.rec dt{color:var(--ink-3)}.rec dd{margin:0;color:var(--ink-2)}
.rec.pick{box-shadow:inset 0 0 0 2px var(--ink)}
.rec .tag{float:right;font-size:var(--text-caption);font-weight:500;padding:0 6px;border-radius:var(--radius);margin-left:8px}
.tag.p{background:var(--positive-soft);color:var(--positive)}.tag.c{background:var(--caution-soft);color:var(--caution)}.tag.n{background:var(--subtle);color:var(--ink-2)}
.entry{border:1px solid var(--line);border-radius:var(--radius);background:var(--subtle);font-size:var(--text-body)}
.entry .hd{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:var(--text-caption);color:var(--ink-3)}
.entry .hd b{font-weight:600;color:var(--ink-2)}
.entry .ln{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 12px}
.entry .ln+.ln{border-top:1px solid var(--line)}
.entry .ft{padding:6px 12px;border-top:1px solid var(--line);font-size:var(--text-caption);color:var(--ink-3)}
.entry.posted{background:var(--positive-soft);border-color:color-mix(in srgb,var(--positive) 40%,transparent)}
.entry.dropped{opacity:.55}
.b{display:inline-flex;min-height:40px;align-items:center;justify-content:center;border-radius:var(--radius);padding:8px 14px;line-height:1.3;font-size:var(--text-lead);border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;width:100%;text-align:center}
.b:hover{background:var(--subtle)}
.b.pri{background:var(--ink);color:var(--surface)}.b.pri:hover{opacity:.85;background:var(--ink)}
.b+.b{margin-top:8px}
.b[disabled]{opacity:.4;cursor:not-allowed}
.acts{margin-top:14px}
.hint{margin-top:10px;font-size:var(--text-meta);color:var(--ink-3)}
.done{border:1px solid color-mix(in srgb,var(--positive) 40%,transparent);background:var(--positive-soft);border-radius:var(--radius);padding:10px 12px;font-size:var(--text-body)}
.done.over{border-color:var(--line-strong);background:var(--subtle)}
.done b{display:block;font-weight:600;margin-bottom:2px}
.next{margin-top:12px}
.lead{display:flex;gap:16px;align-items:flex-start;margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
.lead p{font-size:var(--text-lead);color:var(--ink-2)}
.narrow{max-width:760px}
.src{margin-top:10px;border-left:2px solid var(--ink);padding:8px 12px;background:var(--subtle);font-size:var(--text-body);color:var(--ink-2)}
.src b{color:var(--ink);font-weight:600}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--subtle)}tr.sel td{background:var(--selected)}
tr.clk:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ask{margin-top:16px}
.ask input{height:40px;width:100%;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;font-size:var(--text-lead);color:var(--ink);border-radius:var(--radius)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--subtle);padding:4px 10px;font-size:var(--text-meta);color:var(--ink-2);border-radius:var(--radius);cursor:pointer}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--selected)}
.answer{margin-top:12px;border:1px solid color-mix(in srgb,var(--agent) 30%,transparent);background:color-mix(in srgb,var(--agent-soft) 40%,var(--surface));padding:12px 14px;border-radius:var(--radius);font-size:var(--text-lead);line-height:1.6}
.answer .s{margin-top:8px;font-size:var(--text-caption);color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:var(--radius);font-size:var(--text-body);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.hidden{display:none !important}
.rev{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:var(--text-meta);color:var(--ink-3)}
.rev details{margin-top:8px}.rev summary{cursor:pointer;color:var(--ink-2)}
.rev ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:var(--text-body);max-width:720px}
/* analysis figure: two or three bars to one scale, every value printed */
.fig{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface)}
.fig .cap{font-size:var(--text-caption);color:var(--ink-3);margin-bottom:8px}
.fig .bar{display:grid;grid-template-columns:84px 1fr auto;gap:8px 12px;align-items:center;font-size:var(--text-body);margin-top:6px}
.fig .bar .l{color:var(--ink-2)}
.fig .bar .t{height:10px;background:var(--subtle);border-radius:var(--radius);position:relative;overflow:hidden}
.fig .bar .t i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.fig .bar .t i.extra{background:var(--caution)}
.fig .bar .t i.gap{background:var(--critical);min-width:6px}
.fig .bar .v{font-size:var(--text-meta);color:var(--ink-2);white-space:nowrap}
.fig .bar .v em{font-style:normal;color:var(--caution)}
.fig .bar .v em.g{color:var(--critical)}
.fig .verdict{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--text-lead);font-weight:600}
.fig .verdict.c{color:var(--caution)}.fig .verdict.f{color:var(--critical)}.fig .verdict.p{color:var(--positive)}.fig .verdict.n{color:var(--ink-2)}
/* agent pipeline and trace */
.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pipe .ag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;font-size:var(--text-meta);color:var(--ink-2);background:var(--surface)}
.pipe .ag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--positive)}
.pipe .ag.stop{border-color:var(--caution);color:var(--ink);background:var(--caution-soft)}
.pipe .ag.stop i{background:var(--caution)}
.pipe .ag.over{border-color:var(--line-strong);color:var(--ink-2);background:var(--subtle)}
.pipe .ag.over i{background:var(--line-strong)}
.pipe .arrow{align-self:center;color:var(--ink-3);font-size:var(--text-meta)}
.trace{margin-top:14px;border-left:1px solid var(--line);padding-left:0;list-style:none;margin-left:10px}
.trace li{position:relative;padding:0 0 14px 20px}
.trace li:last-child{padding-bottom:0}
.trace li::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--agent);border:2px solid var(--surface)}
.trace li.stop::before{background:var(--caution)}
.trace li.you::before{background:var(--advisor)}
.trace .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.trace .nm{font-size:var(--text-caption);font-weight:600;color:var(--agent);letter-spacing:.03em;text-transform:uppercase}
.trace .nm span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.trace li.stop .nm{color:var(--caution)}
.trace li.you .nm{color:var(--advisor)}
.trace .at{font-size:var(--text-caption);color:var(--ink-3)}
.trace .did{font-size:var(--text-body);color:var(--ink);margin-top:2px;line-height:1.5}
.trace .did b{font-weight:600}
.trace details{margin-top:6px;font-size:var(--text-meta)}
.trace summary{cursor:pointer;color:var(--ink-3);text-decoration:underline;text-decoration-color:var(--line)}
.trace .ev{margin-top:6px;border:1px solid var(--line);border-radius:var(--radius);background:var(--subtle);padding:8px 10px}
.trace .ev dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.trace .ev dt{color:var(--ink-3)}.trace .ev dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.conf{font-size:var(--text-caption);color:var(--ink-3)}
.conf.lo{color:var(--caution)}
.ver{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--text-caption);color:var(--ink-3);line-height:1.5}
.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px;max-width:960px}
.agents .a{border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0}
.agents .a .n{font-size:var(--text-caption);font-weight:600;color:var(--agent);text-transform:uppercase;letter-spacing:.03em}
.agents .a .n span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.agents .a .v{font-size:var(--text-stat);font-weight:300;line-height:1.1;margin-top:4px}
.agents .a .l{font-size:var(--text-meta);color:var(--ink-3);margin-top:2px}
.policy{margin-top:16px;max-width:960px;border-left:2px solid var(--ink);padding:8px 12px;background:var(--subtle);font-size:var(--text-body);color:var(--ink-2)}
.policy b{color:var(--ink);font-weight:600}
.why{margin-top:14px;max-width:760px;font-size:var(--text-body);color:var(--ink-2)}
/* three beats */
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.beat{border-top:2px solid var(--line);padding-top:10px;min-width:0}
.beat.on{border-top-color:var(--ink)}
.beat .n{font-size:var(--text-caption);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.beat .x{margin-top:4px;font-size:var(--text-body);color:var(--ink)}
/* opener meter */
.meter{margin-top:20px;max-width:720px}
.meter .track{display:flex;height:14px;border-radius:var(--radius);overflow:hidden;gap:2px}
.meter .track i{display:block;height:100%}
.meter .leg{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:var(--text-body);color:var(--ink-2)}
.meter .leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.after{margin-top:14px;font-size:var(--text-body);color:var(--ink-2)}
/* connect, ingest, feedback, learning */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0;font-size:var(--text-body)}
.card .n{font-weight:600;font-size:var(--text-lead)}
.card .d{color:var(--ink-2);margin-top:2px}
.card .l{margin-top:6px;font-size:var(--text-meta);color:var(--ink-3)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:var(--text-caption);font-weight:500;padding:0 6px;border-radius:var(--radius);float:right;margin-left:8px}
.st i{width:6px;height:6px;border-radius:50%;display:inline-block}
.st.ok{background:var(--positive-soft);color:var(--positive)}.st.ok i{background:var(--positive)}
.st.wait{background:var(--subtle);color:var(--ink-2)}.st.wait i{background:var(--line-strong)}
.st.warn{background:var(--caution-soft);color:var(--caution)}.st.warn i{background:var(--caution)}
.sec{font-size:var(--text-caption);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-top:28px}
.uprow{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--text-body)}
.uprow:last-child{border-bottom:0}
.uprow .n{font-weight:600}.uprow .m{font-size:var(--text-meta);color:var(--ink-3)}
.uprow .f{font-size:var(--text-meta);color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.lnk{font-size:var(--text-meta);color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.file{position:relative;overflow:hidden;display:inline-block}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.stage{border:1px solid var(--line);border-radius:var(--radius);margin-top:12px}
.stage .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line-strong);font-size:var(--text-body)}
.stage .hd b{font-weight:600}
.stage ol{margin:0;padding:8px 12px 8px 30px;font-size:var(--text-body);color:var(--ink-2)}
.stage li{padding:2px 0}
.stage li b{color:var(--ink);font-weight:600}
.chunk{margin:8px 12px 12px;border-left:2px solid var(--agent);background:var(--subtle);padding:8px 12px;font-size:var(--text-meta);color:var(--ink-2)}
.chunk b{color:var(--agent);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.step{border-top:2px solid var(--ink);padding-top:8px;min-width:0}
.step .n{font-size:var(--text-caption);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.step .v{font-size:var(--text-stat);font-weight:300;line-height:1.1;margin-top:4px}
.step .x{margin-top:4px;font-size:var(--text-meta);color:var(--ink-2)}
.fb{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.fb .meta{margin-bottom:6px}
.fb textarea{width:100%;min-height:64px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font:inherit;font-size:var(--text-body);color:var(--ink);margin-top:8px;resize:vertical}
.fb .corr{display:grid;grid-template-columns:1fr 110px;gap:6px;margin-top:6px}
.fb .corr input{height:30px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:0 8px;font:inherit;font-size:var(--text-meta);min-width:0}
.fb .corr input.num{text-align:right;font-variant-numeric:tabular-nums}
.fbd{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:var(--text-body);background:var(--subtle)}
.fbd b{font-weight:600}
.fbd .to{margin-top:6px;font-size:var(--text-meta);color:var(--ink-2)}
.fbd .to b{color:var(--agent)}
.learn table td,.learn table th{vertical-align:top}
.learn td.w{color:var(--ink-2);font-size:var(--text-meta)}
.kpi{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.kpi .v{font-size:var(--text-stat-lg);font-weight:300;line-height:1.1}.kpi .l{font-size:var(--text-meta);color:var(--ink-3);margin-top:2px}
.fold{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius)}
.fold>summary{cursor:pointer;padding:8px 12px;font-size:var(--text-body);color:var(--ink-2);list-style:none;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary>b::before{content:"▸ ";color:var(--ink-3)}
.fold[open]>summary>b::before{content:"▾ "}
.fold>summary b{color:var(--ink);font-weight:600}
.fold>.in{padding:4px 12px 12px;border-top:1px solid var(--line)}
.conn{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:var(--text-body);color:var(--ink-2)}
.conn span b{color:var(--ink);font-weight:600}
.conn i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--positive);margin-right:6px;vertical-align:middle}
.guide{margin-top:10px;font-size:var(--text-body);color:var(--ink-2);border-left:2px solid var(--advisor);padding-left:10px}
.guide b{color:var(--advisor);font-weight:600}
tr.exc td{background:var(--caution-soft)}
tr.exc td:first-child{box-shadow:inset 3px 0 0 var(--caution)}
tr.dim td{color:var(--ink-3)}

 '<details class="fold"><summary><b>Where it breaks at scale, and what happens</b><span class="meta">the honest list</span></summary><div class="in"><ul style="margin:8px 0 0;padding-left:18px;font-size:var(--text-body);color:var(--ink-2)"><li><b>Unreadable scans.</b> OCR confidence under 0.90 on any amount, date or name sends the page to a person with the box highlighted. Nothing is guessed.</li><li><b>Template drift.</b> A client renames a column or adds one. The parser matches by name, flags what it cannot place, and a person maps it once; the mapping is saved for that client.</li><li><b>Mixed currencies and value dates.</b> Every line keeps its original currency; conversion is a separate, cited step with the rate and source.</li><li><b>Duplicate documents.</b> The same invoice arriving twice is caught by hash before parsing. A re-sent wire is caught by UETR after parsing and shown to a person, never dropped.</li><li><b>Long documents.</b> An LPA with 300 pages is chunked at clause boundaries, not fixed sizes, so a clause is never split across two chunks; a chunk is cited by ID and page.</li><li><b>Volume spikes.</b> Quarter-end calls bring 20 times the lines. The gate does not move; the exception queue grows and is routed by fund team with the oldest first.</li></ul><p class="meta" style="margin-top:8px">The scale figures are illustrative for a large multi-jurisdiction administrator; the one-fund figures on this page are computed from the dataset above.</p></div></details>'; }

function beats(k,d){ var labels=['Spotted','Checked','Your call']; return '<div class="beats">'+k.beats.map(function(b,i){ return '<div class="beat'+(i===2?' on':'')+'"><p class="n">'+(i+1)+' · '+labels[i]+'</p><p class="x">'+(i===2&&d?(d==='done'?'Done: '+k.btn:'Declined; handled manually'):b)+'</p></div>'; }).join('')+'</div>'; }
function confHtml(c){ return '<span class="conf'+(c<0.9?' lo':'')+'">confidence '+c.toFixed(2)+(c<0.9?' &lt; 0.90':' ≥ 0.90')+'</span>'; }
function pipe(k,d){ var names=['Intake','Matching','Reconciliation','Posting']; return '<div class="pipe">'+names.map(function(nm,i){ var a=k.agents[i]; var cls=a.stop?(d==='done'?'done':d==='declined'?'over':'stop'):'done'; var lbl=a.stop?(d==='done'?': released by Priya':d==='declined'?': overridden':': '+k.stopLabel):': done'; return (i?'<span class="arrow">→</span>':'')+'<span class="ag '+cls+'"><i></i>'+nm+lbl+'</span>'; }).join('')+'</div>'; }
function trace(k,d){ return '<ol class="trace">'+k.agents.map(function(a,idx){ return (idx===3?'':'')+'<li class="'+(a.stop&&!d?'stop':'')+'"><div class="hd"><span class="nm">'+a.n+' <span>· '+KIND[a.n]+'</span></span><span class="at">'+a.at+'</span>'+(a.conf!=null?confHtml(a.conf):'')+'</div><p class="did">'+a.did+'</p><details'+(a.stop&&!d?' open':'')+'><summary>What it read and why</summary><div class="ev"><dl>'+a.ev.map(function(e){return '<dt>'+e[0]+'</dt><dd>'+e[1]+'</dd>';}).join('')+'</dl></div></details>'+(!d?'<input class="lc" data-la="'+a.n+'" data-case="'+k.id+'" value="'+esc(((state.fb[k.id]||{}).lines||{})[a.n]||'')+'" aria-label="Note to the '+a.n+' agent" placeholder="Note to '+a.n+': what did it miss? (optional)">':((state.fb[k.id]||{}).lines||{})[a.n]?'<p class="meta" style="margin-top:4px;color:var(--advisor)">Your note to '+a.n+': “'+esc(state.fb[k.id].lines[a.n])+'”</p>':'')+'</li>'; }).join('')+(d?'<li class="you"><div class="hd"><span class="nm">Priya Naidoo</span><span class="at">1 Oct 09:1'+(CASES.indexOf(k)+2)+'</span></div><p class="did">'+(d==='done'?'Accepted: '+k.btn+'. Posted as a draft journal through the ledger\'s validation under her name.':'Declined. Booked by hand; her entry is diffed against the proposal and counted as an override for the weekly review.')+'</p></li>':'')+'</ol><details class="fold"><summary><b>Versions, run and inputs</b><span class="meta">for the auditor</span></summary><div class="in"><p class="ver" style="border:0;margin-top:6px;padding-top:0">'+VER+'</p></div></details>'; }
function caseView(k,i){ var d=state.done[k.id]; var next=FIRST+i;
  return '<h1 class="t">'+k.title+'</h1><p class="sub">'+who('you','Priya Naidoo, fund accountant')+' · 1 Oct 2026</p>'+frame(d?3:2)+beats(k,d)+
  '<div class="cols"><div class="col"><h2><span class="num">1</span>What came in</h2>'+stmtTable(k.stmt,d)+'<h3>What was asked</h3>'+k.recs.map(recCard).join('')+'</div>'+
  '<div class="col"><h2><span class="num">2</span>What the agents found</h2>'+pipe(k,d)+fig(k.fig,d)+trace(k,d)+'</div>'+
  '<div class="col"><h2><span class="num">3</span>Your decision and note</h2>'+(d?'<div class="done'+(d==='done'?'':' over')+'"><b>'+(d==='done'?'Recorded':'Declined')+'</b>'+(d==='done'?'Posted under your name. No wire has been sent.':'Nothing was posted. Counted as an override.')+'</div><p class="after">'+(d==='done'?k.after:'Priya books it by hand in the ledger. Her entry is diffed against the proposal; the override is reviewed weekly by the controller and blocks any loosening of the gate.')+'</p><div style="margin-top:14px">'+entryBox(k.entry,d)+'</div>'+fbDone(k,d)+'<div class="next"><button class="b pri" data-go="'+next+'">'+(i<CASES.length?'Next case':'Go to the statements')+'</button></div>':'<p class="meta" style="margin-bottom:6px">This will post</p>'+entryBox(k.entry,d)+fbPanel(k)+'<div class="acts"><button class="b pri" data-do="'+k.id+'">'+k.btn+'</button><button class="b" data-decline="'+k.id+'">'+k.alt+'</button></div><p class="hint">Posts to the ledger as a draft journal under your name. No wire is sent from this screen.</p>')+'</div></div>'; }

function statement(){ var key=state.prov; var src=key==null?'':key==='contrib'?contribSrc():SRC[key]; var rows=stmtRows(NOR);
  return '<div class="narrow"><h1 class="t">Four cases, eleven minutes. Six weeks later, 180 statements signed.</h1><p class="sub">'+who('you','Anna Reyes, controller')+' signed 180 investor statements for the quarter to 30 Sep on 12 Nov at 2:06pm, after the valuation committee. Every number traces to a line. Click one.</p>'+frame(4)+
  '<div class="doc" style="margin-top:20px"><div class="hd"><b>Capital account statement · '+NOR.name+'</b><span>Quarter to 30 Sep 2026 · EUR, whole · Meridian European Buyout IV SCSp SICAV-RAIF, Luxembourg · Lux GAAP · Depositary: Luxembourg depositary, AIFMD Art. 21 cash monitoring</span></div><div class="tscroll"><table class="tnum rt"><tr><th></th><th class="num">This quarter</th><th class="num">Since inception</th></tr>'+rows.map(function(r){ return '<tr class="clk'+(state.prov===r[3]?' sel':'')+'" data-prov="'+r[3]+'" tabindex="0" role="button" aria-label="Show source for '+r[0]+'"><td>'+(r[4]?'<strong>':'')+r[0]+(r[4]?'</strong>':'')+'</td><td class="num"'+(r[1]==null?'':' data-l="This quarter"')+'>'+(r[1]==null?'':amt0(r[1]))+'</td><td class="num"'+(r[2]==null?'':' data-l="Since inception"')+'>'+(r[2]==null?'':amt0(r[2]))+'</td></tr>'; }).join('')+'</table></div></div>'+(src?'<div class="src" id="src">'+src+'</div>':'<p class="hint">Try "Contributions" or "Fee offsets": both come from cases you just settled.</p>')+
  '<div style="margin-top:24px;max-width:300px"><button class="b pri" data-go="'+(FIRST+CASES.length+1)+'">See what the client sees</button></div></div>'; }

var QA={fund:{a:'Everyone has now funded the September call: '+D.funded+' of '+INV.length+' investors by 30 September, '+n0(D.callTotal)+' called. '+D.late.map(function(x){return x.name+', '+n0(x.call)+', arrived on 1 Oct, a day late, and is recorded.';}).join(' ')+' Two things were unusual and are settled: Bayfront paid twice and the duplicate is being returned; a '+n0(L(179).amt)+' payment from '+END.name+' came without a reference and was matched by amount.',s:'capital call CC-009; bank lines 87, 88, 179 and 1 Oct line 4; reconciliation 1 Oct'},nordvik:{a:NOR.name+' holds '+pct(NOR)+' of '+FUND.name.split(' SCSp')[0]+' on a '+n0(NOR.commit)+' commitment. The September call of '+n0(NOR.call)+' was received on 29 September, 35 short because of a bank fee the fund absorbed. Closing balance for the quarter to 30 Sep '+n0(stmtRows(NOR)[11][1])+'; unfunded commitment '+n0(stmtRows(NOR)[12][2])+'.',s:'investor record '+NOR.id+'; bank line 89; Q3 statement signed 12 Nov'},fee:{a:'The Q3 management fee is '+n0(D.fee)+' gross and '+n0(D.feeNet)+' after a '+n0(FUND.offset)+' director-fee offset from Bramblewood Software GmbH. The manager was paid gross on 30 September; the '+n0(FUND.offset)+' is recorded as owed back and comes off the Q4 invoice.',s:'fee invoice 15 Sep; offset schedule v7; bank line 181'},none:{a:'I can answer from the settled books: who paid the September call and when, an investor\'s position, or the management fee. Try one of the three below, or ask about a named investor.',s:'none; nothing outside the signed data is answered'}};
function client(){ var t=state.q;
  return '<div class="narrow"><h1 class="t">Friday 2 Oct, 9:05am. The client asks.</h1><p class="sub">'+who('client','Daniel Kerr, CFO of the fund manager')+' His managing partner wants to know who has not paid. He asks the portal, not the administrator.</p>'+frame(4)+
  '<div class="ask"><input id="q" placeholder="Who has not funded the September call?" aria-label="Your question" value="'+esc(state.qtext)+'"><div class="chips"><button class="chip'+(t==='fund'?' on':'')+'" data-q="fund">Who paid late?</button><button class="chip'+(t==='nordvik'?' on':'')+'" data-q="nordvik">Nordvik\'s position</button><button class="chip'+(t==='fee'?' on':'')+'" data-q="fee">The management fee</button></div>'+(t?'<div class="answer">'+who('agent','Clearline')+' '+QA[t].a+'<p class="s">Sources: '+QA[t].s+'</p></div>':'')+'</div>'+
  (t&&t!=='none'?'<div class="lead"><p>The answer is the data Priya settled and Anna signed, with the plumbing removed. The GP sees investor-level detail under the LPA; each investor sees only its own. The operations work earns the trust; this page is what the client pays for.</p></div><div style="margin-top:20px;max-width:300px"><button class="b pri" data-go="'+(FIRST+CASES.length+2)+'">See what Clearline learned</button></div>':'')+
  '<div class="rev">For reviewers<details><summary>How it is governed</summary><ul><li>Clearline books a wire without a person only above a confidence gate the controller sets per fund. A new fund starts at 1.00: every wire goes to a person.</li><li>Refunds, payment-instruction changes, KYC ratings, amounts due from the manager and statement release are never automatic, whatever the confidence. An instruction change arrives as a case with the old and new instruction side by side; the agent only drafts the call-back script.</li><li>Nothing writes to the ledger directly. Every entry goes in as a draft journal through the eFront Invest journal API and that system\'s own validation and approval. A reversal is a journal with the same trace.</li><li>Every decision is logged with the person, the agent versions, the run and the inputs, in the form the AIFM\'s oversight and a CSSF Circular 22/806 outsourcing review expect.</li></ul></details>'+
  '<details><summary>How it is measured</summary><ul><li>Every posted entry is compared with the controller\'s statement review and the quarter\'s audit adjustments. The reversal rate above the gate must stay under 1 in 500.</li><li>Declines count as overrides. Overrides are reviewed weekly by the controller; a rising override rate blocks any loosening of the gate. The gate moves only on a 90-day window and model versions are frozen per quarter.</li><li>When the model is wrong and nobody declines, three nets remain: the nightly cash reconciliation ties bank to ledger; a 1-in-20 random sample of auto-booked wires goes to a person; the investor sees the line on the statement and the portal. A silent error survives only if all three miss it.</li><li>At 2,000 funds: policy is per fund, one Matching model per administrator. Exceptions scale with wires, not funds. What breaks first is people: 20,000 exceptions a quarter need a queue and routing, not four screens.</li></ul></details>'+
  '<details><summary>Who else is near this, and what it costs</summary><ul><li>Document extraction and portal chatbots are crowded. Reconciliation agents exist for hedge-fund trades and for one administrator\'s own funds. Statement review exists after the fact, sold to fund managers to check their administrator.</li><li>Nobody runs one audited chain from the bank line through booking, reconciliation and signed statements inside the administrator, then gives the clean data back to the client. That seam is the product.</li><li>Pricing: per fund per month on top of the administration fee, scaled by the share of wires booked without a person. Not yet set.</li></ul></details><p style="margin-top:8px">Prototype on synthetic data. Fund, investors, people and figures are fictional; the mechanics follow Luxembourg RAIF practice: ILPA reporting template, Lux GAAP, AIFMD depositary duties, CSSF 22/806.</p></div></div>'; }

function ask(v){ var s=v.toLowerCase(); state.qtext=v; state.q=/nordvik/.test(s)?'nordvik':/fee/.test(s)?'fee':/(fund|paid|pay|late|call|who)/.test(s)?'fund':'none'; render(); }
function wire(c){ c.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ go(+b.dataset.go); }); }); c.querySelectorAll('[data-do]').forEach(function(b){ b.addEventListener('click',function(){ state.done[b.dataset.do]='done'; toast('Recorded under your name. No wire was sent.'); render(); }); }); c.querySelectorAll('[data-decline]').forEach(function(b){ b.addEventListener('click',function(){ var f=state.fb[b.dataset.decline]; if(!f||!f.r.length){ toast('Pick at least one reason so the decline teaches something.'); var fo=el('fbfold'); if(fo) fo.open=true; var ch=c.querySelector('.chip[data-r]'); if(ch) ch.focus(); return; } state.done[b.dataset.decline]='declined'; toast('Declined. Counted as an override, with your reason.'); render(); }); });
 function fbOf(id){ return state.fb[id]||(state.fb[id]={r:[],t:'',c:null}); }
 c.querySelectorAll('[data-r]').forEach(function(ch){ ch.addEventListener('click',function(){ var f=fbOf(ch.dataset.case); var i=f.r.indexOf(ch.dataset.r); if(i>=0) f.r.splice(i,1); else f.r.push(ch.dataset.r); ch.classList.toggle('on',i<0); }); });
 var ta=c.querySelector('#fbt'); if(ta) ta.addEventListener('input',function(){ fbOf(ta.dataset.case).t=ta.value; });
 c.querySelectorAll('.lc[data-la]').forEach(function(inp){ inp.addEventListener('input',function(){ var f=fbOf(inp.dataset.case); f.lines=f.lines||{}; f.lines[inp.dataset.la]=inp.value; }); });
 c.querySelectorAll('[data-ci]').forEach(function(inp){ inp.addEventListener('input',function(){ var k=CASES.filter(function(x){return x.id===inp.dataset.case;})[0]; var f=fbOf(inp.dataset.case); if(!f.c) f.c=k.entry.ln.map(function(l){return l.slice();}); f.c[+inp.dataset.ci][+inp.dataset.cf]=inp.value; }); });
 c.querySelectorAll('[data-up]').forEach(function(inp){ inp.addEventListener('change',function(){ if(inp.files[0]) readUpload(inp.dataset.up,inp.files[0]); }); });
 c.querySelectorAll('[data-sample]').forEach(function(b){ b.addEventListener('click',function(){ state.sample=true; toast('Sample dataset loaded.'); render(); }); });
 c.querySelectorAll('[data-map]').forEach(function(b){ b.addEventListener('click',function(){ var r=state.up[b.dataset.map]; if(r){ r.missing=[]; toast('Columns mapped by name; saved for this fund.'); render(); } }); }); c.querySelectorAll('[data-prov]').forEach(function(tr){ var f=function(){ state.prov=tr.dataset.prov; render(); var row=c.querySelector('[data-prov="'+state.prov+'"]'); if(row) row.focus({preventScroll:true}); var s=el('src'); if(s) s.scrollIntoView({block:'nearest'}); }; tr.addEventListener('click',f); tr.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f(); } }); }); c.querySelectorAll('[data-q]').forEach(function(ch){ ch.addEventListener('click',function(){ state.q=ch.dataset.q; state.qtext=''; render(); }); }); var q=c.querySelector('#q'); if(q) q.addEventListener('keydown',function(e){ if(e.key==='Enter') ask(q.value); }); }
el('back').addEventListener('click',function(){ if(state.step>0) go(state.step-1); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&state.step>0&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) go(state.step-1); });
window.addEventListener('popstate',function(e){ var s=e.state&&e.state.step!=null?e.state.step:0; if(s>=0&&s<TOTAL){ state.step=s; state.prov=null; render(); window.scrollTo({top:0}); } });
var h=parseInt(location.hash.slice(1),10); var start=(h>=0&&h<TOTAL)?h:0; history.replaceState({step:start},'',location.pathname+location.search+(start?'#'+start:'')); go(start,true);
})();
</script>
